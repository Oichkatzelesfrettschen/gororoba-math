name = "GororobaMath"
defaultTargets = ["GororobaMath"]

[leanOptions]
autoImplicit = false
# Mathlib's standard linter set, so that `lake build --wfail` fails on its
# warnings too. Its header linter checks Mathlib's copyright and authors
# header, which this repository replaces by one SPDX line per file, so it
# is off.
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "GororobaMath"

[[lean_lib]]
name = "AxiomAudit"

[[lean_lib]]
name = "AuditFixture"

[[lean_lib]]
name = "ReplayFixture"

# Challenge modules: each restates headline theorems of the library with
# `sorry` as the proof; `lake comparator --config Challenge/NAME.json`
# checks the library against them. No library module imports them and the
# admission gate does not build them.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge.*"]
