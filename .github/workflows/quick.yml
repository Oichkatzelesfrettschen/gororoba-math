name: quick

# The pull-request tier of the gate, on every pull request and every push to
# main. The job quick runs the checks of ci/check.sh that need no build: the
# lints of shell scripts, Python files and workflows, the signal-trap check,
# the headline registry and the claims ledger. The job build restores the
# Lean build tree that the last full gate on main saved and runs
# ci/check.sh --build, which compiles the changed modules and those that
# import them, audits the axioms and stops before the kernel replay. The job
# main-gate fails a pull request while the latest completed lean or rocq run
# on main is not a success, so a red main stops merges. The lean and rocq
# workflows hold the full gate; they run nightly, on every push to main and
# on manual dispatch (AGENTS.md, "Landing"). A pull request merges when this
# workflow is green; the full gates then run on the push to main. A
# manual dispatch of this workflow runs the jobs quick, build and rocq-changed
# on a ref. The job rocq-changed compiles the Rocq sources a pull request
# changes, and those that import them, over the objects that the last green
# rocq run on main saved (ci/check_rocq.sh --changed): no kernel check, and
# a skip when no path under rocq/, ci/install_rocq.sh or the scripts of that
# tier differs from the base. A dispatch compares with origin/main and takes
# the input rocq_probe, a tracked source that the job treats as changed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rocq_probe:
        description: "rocq-changed: a tracked rocq/**/*.v source to treat as changed (a measurement aid)"
        type: string
        default: ""

concurrency:
  group: quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quick:
    name: quick
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck, ruff and actionlint
        run: |
          command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          pipx install ruff==0.14.11
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the quick checks
        run: sh ci/check.sh --quick

  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "true"
      # The lean workflow saves this tree after a green gate on main. Without
      # a restored tree the build compiles every module (about 5 minutes).
      - name: Restore the library build tree of main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Install shellcheck, ruff and actionlint
        run: |
          command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          pipx install ruff==0.14.11
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the changed modules and audit the axioms
        run: sh ci/check.sh --build

  rocq-changed:
    name: rocq-changed
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # A saved build tree and switch make the job a few minutes; without them
    # it installs the switch (about 21 minutes) and compiles every source
    # (about 20 minutes, measured 2026-11-26).
    timeout-minutes: 120
    env:
      OPAMROOT: ${{ github.workspace }}/.opam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Decide whether a Rocq source changed
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=HEAD^1
          else
            git fetch --no-tags --depth=1 origin main
            base=FETCH_HEAD
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
          set -- --changed --plan --base "$base"
          if [ -n "$PROBE" ]; then
            set -- "$@" --probe "$PROBE"
          fi
          sh ci/check_rocq.sh "$@"
        env:
          PROBE: ${{ inputs.rocq_probe }}
      - name: Install system packages
        if: steps.plan.outputs.touched == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opam m4 pkg-config libgmp-dev git make gcc clang unzip bubblewrap
      # The key is that of rocq.yml, which saves the switch.
      - name: Restore the opam switch
        if: steps.plan.outputs.touched == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .opam
          key: opam-rocq-v2-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('rocq/open/opam/**', 'ci/install_rocq.sh') }}
      - name: Install the Rocq toolchain
        if: steps.plan.outputs.touched == 'true'
        run: sh ci/install_rocq.sh
      # The rocq workflow saves this tree after a green gate on main. Without
      # one the job compiles every source.
      - name: Restore the Rocq build tree of main
        if: steps.plan.outputs.touched == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rocq-objects
          key: rocq-objects-${{ hashFiles('rocq/open/opam/**', 'ci/install_rocq.sh') }}-${{ github.sha }}
          restore-keys: rocq-objects-${{ hashFiles('rocq/open/opam/**', 'ci/install_rocq.sh') }}-
      - name: Compile the changed Rocq sources
        if: steps.plan.outputs.touched == 'true'
        env:
          BASE: ${{ steps.plan.outputs.base }}
          PROBE: ${{ inputs.rocq_probe }}
        run: |
          set -- --changed --base "$BASE"
          if [ -n "$PROBE" ]; then
            set -- "$@" --probe "$PROBE"
          fi
          ROCQ_OBJECTS="$RUNNER_TEMP/rocq-objects" ROCQ_BUILD_DIR="$RUNNER_TEMP" sh ci/check_rocq.sh "$@"

  main-gate:
    name: main-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      # A run that a newer run replaced while it waited reads cancelled; it
      # is no verdict, so the latest run with one decides. A pull request
      # whose own head is green in both workflows passes, so the repair of
      # a red main can merge.
      - name: Require the latest full gate on main to be green
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          green_on_head() {
            count=$(gh run list --repo "$REPOSITORY" --workflow "$1" --commit "$HEAD_SHA" --status completed --json conclusion --jq 'map(select(.conclusion == "success")) | length')
            case $count in
            "" | 0) return 1 ;;
            esac
          }
          status=0
          for workflow in lean.yml rocq.yml; do
            conclusion=$(gh run list --repo "$REPOSITORY" --workflow "$workflow" --branch main --status completed --limit 30 --json conclusion,url --jq 'map(select(.conclusion != "cancelled" and .conclusion != "skipped")) | .[0] | "\(.conclusion) \(.url)"')
            echo "$workflow on main: $conclusion"
            case $conclusion in
            "success "*) ;;
            *) status=1 ;;
            esac
          done
          [ "$status" -ne 0 ] || exit 0
          if green_on_head lean.yml && green_on_head rocq.yml; then
            echo "main-gate: main is red and both full workflows are green on this head; the pull request may repair it"
            exit 0
          fi
          echo "main-gate: the latest full gate on main with a verdict is not a success; main is repaired before another merge" >&2
          exit 1
