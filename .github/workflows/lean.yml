name: lean

# The Lean half of the admission gate, ci/check.sh: the library builds with
# warnings as errors, the axiom audit accepts it and rejects its known-bad
# fixture, and the kernel replay (ci/replay_modules.lean) replays every module. It runs nightly on main, on every push to main and
# on manual dispatch on a named ref (gh workflow run lean.yml --ref BRANCH),
# which a pull request that changes the toolchain or a gate script may get by
# hand (AGENTS.md, "Landing"). The quick workflow builds the changed modules
# on every pull request.
on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs elan with the toolchain of lean/lean-toolchain and fetches
      # the prebuilt Mathlib of lean/lake-manifest.json; ci/check.sh builds.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "true"
      - name: Install shellcheck, ruff and actionlint
        run: |
          command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          pipx install ruff==0.14.11
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the gate
        run: sh ci/check.sh
      # One issue per workflow holds its red runs of main; a later red run
      # adds a comment. The step follows the gate and precedes every later
      # step, so it reports a failed gate and nothing else.
      - name: Report a red gate on main
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: The lean gate is red on main
        run: |
          body="The lean workflow failed on main at $GITHUB_SHA: $RUN_URL"
          number=$(gh issue list --repo "$REPOSITORY" --state open --limit 200 --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$TITLE" --body "$body"
          fi
      - name: Save the library build tree
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}
