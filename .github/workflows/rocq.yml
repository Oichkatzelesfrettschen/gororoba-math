name: rocq

# The Rocq half of the admission gate, ci/check_rocq.sh. It runs nightly on
# main, on every push to main and on manual dispatch on a named ref (gh workflow run rocq.yml --ref
# BRANCH), which a pull request that touches rocq/ or a Rocq gate script gets
# once on its final head before the merge (AGENTS.md, "Landing"); a run takes
# about 43 minutes with a restored switch (measured 2026-11-23). No trigger
# carries a path filter: a filter reads a bounded prefix of a large diff, and
# a change to a .gitattributes file alters the export the gate builds from.
on:
  schedule:
    - cron: "47 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kernel:
        description: "Conversion of the kernel checker: vm (bytecode machine) or pure (the checker's own reduction)"
        type: choice
        options: [vm, pure]
        default: vm

concurrency:
  group: rocq-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    # A run without a restored switch compiles OCaml, Rocq and MathComp
    # before the proofs, and the gate itself took 66 to 105 minutes on
    # 2026-11-23.
    timeout-minutes: 210
    env:
      OPAMROOT: ${{ github.workspace }}/.opam
      # The nightly run and a dispatch with kernel=pure re-check with the
      # checker's own reduction; a push to main and a default dispatch let
      # the checker use the bytecode machine (ci/check_rocq.sh).
      ROCQ_CHECK_VM: ${{ (github.event_name == 'schedule' || inputs.kernel == 'pure') && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opam m4 pkg-config libgmp-dev git make gcc clang unzip bubblewrap
          command -v rustc
      # The key follows the ports and the installer. The token v2 stands for
      # the runner image and the system packages of the step above and is
      # raised by hand when either changes: a key that hashed this file
      # rebuilt the switch from source (about 40 minutes) on every edit of a
      # trigger or a comment.
      - name: Restore the opam switch
        id: opam
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .opam
          key: opam-rocq-v2-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('rocq/open/opam/**', 'ci/install_rocq.sh') }}
      - name: Install the Rocq toolchain
        run: sh ci/install_rocq.sh
      - name: Save the opam switch
        if: steps.opam.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .opam
          key: ${{ steps.opam.outputs.cache-primary-key }}
      - name: Run the Rocq gate
        run: ROCQ_BUILD_DIR="$RUNNER_TEMP" sh ci/check_rocq.sh
      # One issue per workflow holds its red runs of main; a later red run
      # adds a comment. The step follows the gate and precedes every later
      # step, so it reports a failed gate and nothing else.
      - name: Report a red gate on main
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: The rocq gate is red on main
        run: |
          body="The rocq workflow failed on main at $GITHUB_SHA: $RUN_URL"
          number=$(gh issue list --repo "$REPOSITORY" --state open --limit 200 --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$TITLE" --body "$body"
          fi
